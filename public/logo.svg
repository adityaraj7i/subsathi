<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" width="100%" height="100%">
  <defs>
    <!-- Play button gradient: Blue to Purple -->
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00A3FF" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Sathi text gradient -->
    <linearGradient id="sathiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0088FF" />
      <stop offset="40%" stop-color="#3B82F6" />
      <stop offset="75%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- ==================== TV ICON ==================== -->
  <g transform="translate(12, 10)">
    <!-- Antenna Left -->
    <path d="M 44 26 L 30 10" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />
    
    <!-- Antenna Right -->
    <path d="M 52 26 L 66 10" stroke="#0F172A" stroke-width="6" stroke-linecap="round" />

    <!-- TV Outer Frame -->
    <rect x="6" y="26" width="90" height="72" rx="22" ry="22" fill="none" stroke="#0F172A" stroke-width="7" stroke-linejoin="round" />

    <!-- Gradient Play Triangle inside TV -->
    <path d="M 36 43 C 36 40.5 39 39 41.2 40.4 L 69.5 58.6 C 71.5 59.9 71.5 62.8 69.5 64.1 L 41.2 82.3 C 39 83.7 36 82.2 36 79.7 Z" fill="url(#playGrad)" />
  </g>

  <!-- ==================== "SubSathi" TEXT (Unified flow, Zero Overlap) ==================== -->
  <g transform="translate(130, 0)">
    <!-- Continuous Single Text flow to guarantee zero collision between Sub and Sathi -->
    <text x="0" y="84" font-family="'Plus Jakarta Sans', 'Poppins', 'Outfit', -apple-system, sans-serif" font-size="76" font-weight="900" letter-spacing="-1">
      <tspan fill="#0F172A">Sub</tspan><tspan fill="url(#sathiGrad)">Sathi</tspan>
    </text>

    <!-- Sparkle Rays above the 'i' -->
    <path d="M 324 24 L 326 12" stroke="#00A3FF" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 333 29 L 343 20" stroke="#00A3FF" stroke-width="4.5" stroke-linecap="round" />
    <path d="M 338 39 L 350 37" stroke="#7C3AED" stroke-width="4.5" stroke-linecap="round" />

    <!-- ==================== TAGLINE ==================== -->
    <text x="2" y="118" font-family="'Plus Jakarta Sans', 'Poppins', 'Inter', -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#0F172A" letter-spacing="3.8">
      AI TOOLS  •  SOFTWARE  •  SUBSCRIPTIONS
    </text>
  </g>
</svg>
